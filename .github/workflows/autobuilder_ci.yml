name: AutoBuilder CI
on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold when absent
        shell: bash
        run: if [ ! -d android ]; then flutter create --platforms=android .; fi
      - name: Apply project-specific Android patch when available
        shell: bash
        run: if [ -f tool/patch_android.py ]; then python3 tool/patch_android.py; fi
      - run: flutter pub get
      - name: Patch project Android resources and compatibility settings
        run: python3 .autobuilder/universal_android_patcher.py
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
