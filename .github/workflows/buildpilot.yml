name: BuildPilot Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buildpilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then flutter create . --platforms=android; fi
      - name: Apply Android compatibility patch
        run: |
          if [ -f tool/patch_android.py ]; then python3 tool/patch_android.py; else python3 .github/buildpilot/patch_flutter_android.py; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: buildpilot-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30