name: BuildPilot
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory _out | Out-Null
          Copy-Item build/windows/x64/runner/Release/* _out -Recurse
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: _out/**
          if-no-files-found: error
