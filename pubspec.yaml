name: barnamevar
description: برنامه‌ریز فارسی جلالی
publish_to: none
version: 2.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1
  flutter_timezone: ^1.0.8
  timezone: ^0.9.4
  cryptography: ^2.7.0
  file_picker: ^8.0.6
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
